<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benefits selection</title>
<style>
  :root{
    --paper:#FFFFFF;
    --panel:#F7F7F8;
    --ink:#000000;
    --rule:#C9C9CB;
    --rule-soft:#E6E6E8;
    --grey:#6B6B70;
    --grey-soft:#8A8A8F;
    --red:#E4002B;
    --gutter:32px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font:400 15px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:1180px;margin:0 auto;padding:0 var(--gutter) 88px}

  .masthead{padding:56px 0 26px}
  h1{margin:0;font-size:clamp(30px,4.6vw,52px);line-height:1.02;letter-spacing:-.025em;font-weight:700}
  .lede{max-width:56ch;margin:14px 0 0;color:#3A3A3C}

  .board{display:grid;grid-template-columns:minmax(0,1fr) 440px;border-top:1px solid var(--ink)}
  h2{margin:0;font-size:13px;font-weight:500;color:var(--grey)}
  .catalogue{padding:22px 40px 48px 0;border-right:1px solid var(--rule)}
  .cart-col{padding:22px 0 48px 40px}

  /* catalogue */
  .tree{list-style:none;margin:14px 0 0;padding:0}
  .node{border-bottom:1px solid var(--rule-soft)}
  .node:first-child{border-top:1px solid var(--rule-soft)}
  .row{display:flex;align-items:center;gap:16px;width:100%;padding:13px 4px;margin:0;
       background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;
       user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  .row:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
  .row .name{flex:1;min-width:0}
  .row--drag{touch-action:none;cursor:grab}
  .row--drag:hover .icobox{border-color:var(--ink)}
  .row--cat{font-weight:500}
  .icobox{width:40px;height:40px;flex:none;border:1px solid var(--rule);background:var(--paper);
          display:grid;place-items:center}
  .ico{width:24px;height:24px;display:block}
  .toggle{width:14px;height:14px;flex:none;color:var(--grey)}
  .node.is-open .toggle .bar-v{opacity:0}
  .tick{width:18px;height:18px;flex:none;color:var(--red);opacity:0}
  .row.is-added .tick{opacity:1}
  .row.is-added .icobox{background:var(--panel);border-color:var(--ink)}

  .sub{list-style:none;margin:0;padding:0;display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
  .node.is-open .sub{grid-template-rows:1fr}
  .sub-inner{overflow:hidden}
  .sub .row{padding-left:46px;position:relative}
  .sub .row::before{content:"";position:absolute;left:20px;top:50%;width:16px;height:1px;background:var(--rule)}
  .sub-inner > .row:last-child{margin-bottom:6px}

  /* cart */
  .col-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
            padding-bottom:6px;border-bottom:1px solid var(--rule-soft)}
  .unit{font-size:12.5px;color:var(--grey);font-variant-numeric:tabular-nums}
  .price{font-size:13.5px;color:var(--grey);font-variant-numeric:tabular-nums;text-align:right;min-width:54px}
  .row.is-added .price{color:var(--ink)}
  .cart{position:relative;margin-top:16px;border:1px solid var(--ink);transition:border-color .15s ease}
  .cart.is-over{border-color:var(--red)}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule-soft)}
  .cart.is-over .slots{background:rgba(228,0,43,.35)}
  .slot{aspect-ratio:1;background:var(--paper)}
  .slot--filled{width:100%;padding:0;border:0;background:var(--panel);color:var(--ink);
                display:grid;place-items:center;cursor:pointer}
  .slot--filled:hover,.slot--filled:focus-visible{background:var(--paper);color:var(--red);outline:0}
  .slot--filled .ico{width:34px;height:34px}
  .hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;
        background:var(--paper);padding:7px 16px;font-size:12.5px;color:var(--grey-soft);pointer-events:none}

  .chosen{list-style:none;margin:22px 0 0;padding:0;border-top:1px solid var(--ink)}
  .chosen .name{flex:1;min-width:0}
  .chosen li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule-soft);font-size:14px}
  .chosen .ico{width:20px;height:20px}
  .rm{margin-left:auto;border:0;background:none;padding:6px;cursor:pointer;color:var(--grey-soft);line-height:0}
  .rm:hover,.rm:focus-visible{color:var(--red);outline:0}
  .rm svg{width:14px;height:14px;display:block}

  .total{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
         margin-top:18px;padding-top:14px;border-top:1px solid var(--ink)}
  .total-label{font-size:13px;font-weight:500}
  .amount{margin:0;display:flex;align-items:baseline;gap:9px}
  .amount b{font-size:46px;line-height:.85;font-weight:700;color:var(--red);letter-spacing:-.035em;
            font-variant-numeric:tabular-nums}
  .amount span{font-size:12.5px;color:var(--grey)}
  .caption{margin:14px 0 0;font-size:12px;color:var(--grey-soft)}
  .cart-foot{margin-top:22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .confirm{appearance:none;border:1px solid var(--ink);background:var(--ink);color:#fff;font:inherit;
           font-weight:500;padding:13px 24px;cursor:pointer}
  .confirm:disabled{background:none;color:#A0A0A5;border-color:var(--rule);cursor:not-allowed}
  .confirm:not(:disabled):hover{background:var(--red);border-color:var(--red)}
  .confirm:focus-visible{outline:2px solid var(--red);outline-offset:2px}
  .note{margin:0;font-size:13.5px}
  .linkbtn{border:0;background:none;padding:0;font:inherit;color:var(--red);text-decoration:underline;cursor:pointer}

  .ghost{position:fixed;z-index:50;top:0;left:0;pointer-events:none;display:flex;align-items:center;gap:12px;
         background:var(--paper);border:1px solid var(--red);padding:7px 16px 7px 7px;font-size:14px;
         transform:translate(-50%,-50%)}
  .ghost[hidden]{display:none}
  body.is-dragging{cursor:grabbing}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:900px){
    .board{grid-template-columns:minmax(0,1fr)}
    .catalogue{border-right:0;padding:22px 0 34px}
    .cart-col{padding:24px 0 40px;border-top:1px solid var(--rule)}
    .cart{max-width:420px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <h1>Benefits selection</h1>
    <p class="lede">Open a category to see what it includes. Drag a benefit into your selection, or select one and press Enter to add it.</p>
  </header>

  <main class="board">
    <section class="catalogue" aria-labelledby="cat-h">
      <div class="col-head">
        <h2 id="cat-h">Available benefits</h2>
        <span class="unit">RON per month</span>
      </div>
      <ul class="tree" id="tree"></ul>
    </section>

    <section class="cart-col" aria-labelledby="cart-h">
      <div class="col-head">
        <h2 id="cart-h">Your benefits</h2>
        <span class="unit"><b id="count">0</b> of 8 selected</span>
      </div>

      <div class="cart" id="cart">
        <div class="slots" id="basket"></div>
        <p class="hint" id="hint">Drag benefits here</p>
      </div>

      <ul class="chosen" id="chosen" hidden></ul>

      <div class="total">
        <span class="total-label">Total</span>
        <p class="amount"><b id="total">0</b><span>RON per month</span></p>
      </div>

      <div class="cart-foot">
        <button class="confirm" id="confirm" disabled>Confirm selection</button>
        <p class="note" id="note" hidden></p>
      </div>
    </section>
  </main>
</div>

<div class="ghost" id="ghost" hidden></div>
<p class="sr" id="live" aria-live="polite"></p>

<script>
const ICONS = {
  cross:'<path d="M9.6 3h4.8v6.6H21v4.8h-6.6V21H9.6v-6.6H3V9.6h6.6z" fill="var(--red)" stroke="none"/>',
  stethoscope:'<path d="M6 3v5.5a5 5 0 0 0 10 0V3"/><path d="M11 13.5V17"/><circle cx="11" cy="19.5" r="2.4"/>',
  tooth:'<path d="M7 4.2c1.3-1 2.7-1 3.6-.4.9.6 1.9.6 2.8 0 .9-.6 2.3-.6 3.6.4 1.6 1.2 1.5 4 .9 6.6-.5 2-.8 3.3-1.1 5.2-.3 1.9-.6 3.5-1.7 3.5-1.2 0-1.2-4-2.1-4s-.9 4-2.1 4c-1.1 0-1.4-1.6-1.7-3.5-.3-1.9-.6-3.2-1.1-5.2-.6-2.6-.7-5.4.9-6.6z"/>',
  coins:'<ellipse cx="12" cy="6.5" rx="7" ry="2.8"/><path d="M5 6.5v5c0 1.6 3.1 2.8 7 2.8s7-1.2 7-2.8v-5"/><path d="M5 11.5v5c0 1.6 3.1 2.8 7 2.8s7-1.2 7-2.8v-5"/>',
  pillar:'<path d="M12 3.5 3.5 7h17z"/><path d="M4.5 9.5h15"/><path d="M7 9.5v9M12 9.5v9M17 9.5v9"/><path d="M5.5 18.5h13M3.5 20.5h17"/>',
  umbrella:'<path d="M2.5 12.5a9.5 9.5 0 0 1 19 0z"/><path d="M12 12.5v5.6a2.5 2.5 0 0 0 5 0"/>',
  cutlery:'<path d="M6 3v4.5a2.6 2.6 0 0 0 2.6 2.6h0a2.6 2.6 0 0 0 2.6-2.6V3"/><path d="M8.6 3v4.2"/><path d="M8.6 10.1V21"/><path d="M17.5 21V3"/><path d="M17.5 13.6c-3-2-3-8.3 0-10.6"/>',
  dumbbell:'<path d="M3.5 9v6M6.5 6.5v11M17.5 6.5v11M20.5 9v6M6.5 12h11"/>',
  bus:'<path d="M4 3.5h16v12.5H4z"/><path d="M4 10h16"/><path d="M7 13h2M15 13h2"/><circle cx="8" cy="18.5" r="2"/><circle cx="16" cy="18.5" r="2"/>',
  book:'<path d="M12 6.2C10.8 4.9 9 4.2 6.5 4.2H3.5v13H7c2.2 0 3.9.6 5 1.8"/><path d="M12 6.2c1.2-1.3 3-2 5.5-2h3v13H17c-2.2 0-3.9.6-5 1.8"/><path d="M12 6.2V19"/>'
};

const CATALOGUE = [
  {kind:'category', id:'health', name:'Health cover', icon:'cross', children:[
    {id:'medical', name:'Private medical subscription', icon:'stethoscope', price:180},
    {id:'dental',  name:'Dental plan',                  icon:'tooth',       price:90}
  ]},
  {kind:'category', id:'financial', name:'Financial security', icon:'coins', children:[
    {id:'pension', name:'Pillar III pension', icon:'pillar',   price:250},
    {id:'life',    name:'Life insurance',     icon:'umbrella', price:60}
  ]},
  {kind:'benefit', id:'meal',      name:'Meal vouchers',        icon:'cutlery',  price:700},
  {kind:'benefit', id:'gym',       name:'Gym membership',       icon:'dumbbell', price:200},
  {kind:'benefit', id:'transport', name:'Public transport pass',icon:'bus',      price:80},
  {kind:'benefit', id:'learning',  name:'Learning budget',      icon:'book',     price:300}
];

const BENEFITS = new Map();
CATALOGUE.forEach(entry => {
  if (entry.kind === 'category') entry.children.forEach(c => BENEFITS.set(c.id, c));
  else BENEFITS.set(entry.id, entry);
});

const TOTAL = BENEFITS.size;
const cart = [];
let confirmed = false;

const el = {
  tree: document.getElementById('tree'),
  basket: document.getElementById('basket'),
  hint: document.getElementById('hint'),
  chosen: document.getElementById('chosen'),
  count: document.getElementById('count'),
  total: document.getElementById('total'),
  cartBox: document.getElementById('cart'),
  confirm: document.getElementById('confirm'),
  note: document.getElementById('note'),
  ghost: document.getElementById('ghost'),
  live: document.getElementById('live')
};

function icon(name, cls){
  return '<svg class="' + (cls || 'ico') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
         'stroke-width="1.6" aria-hidden="true">' + ICONS[name] + '</svg>';
}
function money(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function iconBox(name){ return '<span class="icobox">' + icon(name) + '</span>'; }
const TICK = '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 12.5 9.5 18 20 6.5"/></svg>';
const TOGGLE = '<svg class="toggle" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M0 7h14"/><path class="bar-v" d="M7 0v14"/></svg>';
const CLOSE = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1 1l12 12M13 1L1 13"/></svg>';

/* build the catalogue */
CATALOGUE.forEach(entry => {
  const li = document.createElement('li');
  li.className = 'node';

  if (entry.kind === 'category') {
    const head = document.createElement('button');
    head.type = 'button';
    head.className = 'row row--cat';
    head.setAttribute('aria-expanded', 'false');
    head.innerHTML = iconBox(entry.icon) + '<span class="name">' + entry.name + '</span>' + TOGGLE;
    head.addEventListener('click', () => {
      const open = li.classList.toggle('is-open');
      head.setAttribute('aria-expanded', String(open));
    });

    const sub = document.createElement('ul');
    sub.className = 'sub';
    const inner = document.createElement('div');
    inner.className = 'sub-inner';
    entry.children.forEach(child => inner.appendChild(benefitRow(child)));
    sub.appendChild(inner);

    li.appendChild(head);
    li.appendChild(sub);
  } else {
    li.appendChild(benefitRow(entry));
  }
  el.tree.appendChild(li);
});

function benefitRow(benefit){
  const row = document.createElement('div');
  row.className = 'row row--drag';
  row.dataset.id = benefit.id;
  row.setAttribute('role', 'button');
  row.tabIndex = 0;
  row.innerHTML = iconBox(benefit.icon) + '<span class="name">' + benefit.name + '</span>' +
                  '<span class="price">' + money(benefit.price) + '</span>' + TICK;
  row.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(benefit.id); }
  });
  attachDrag(row, benefit);
  return row;
}

/* drag with pointer events so mouse and touch behave the same */
let drag = null;

function attachDrag(row, benefit){
  row.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    drag = {id: benefit.id, x: e.clientX, y: e.clientY, moved: false};
    row.setPointerCapture(e.pointerId);
  });

  row.addEventListener('pointermove', e => {
    if (!drag) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) {
      drag.moved = true;
      document.body.classList.add('is-dragging');
      el.ghost.innerHTML = iconBox(benefit.icon) + '<span>' + benefit.name + '</span>';
      el.ghost.hidden = false;
    }
    if (drag.moved) {
      el.ghost.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px) translate(-50%,-50%)';
      el.cartBox.classList.toggle('is-over', overCart(e.clientX, e.clientY));
    }
  });

  row.addEventListener('pointerup', e => {
    if (!drag) return;
    if (drag.moved) { if (overCart(e.clientX, e.clientY)) add(drag.id); }
    else { toggle(drag.id); }
    endDrag();
  });

  row.addEventListener('pointercancel', endDrag);
}

function endDrag(){
  drag = null;
  el.ghost.hidden = true;
  el.cartBox.classList.remove('is-over');
  document.body.classList.remove('is-dragging');
}

function overCart(x, y){
  const r = el.cartBox.getBoundingClientRect();
  return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
}

/* state */
function add(id){
  if (cart.includes(id)) { say(BENEFITS.get(id).name + ' is already selected'); return; }
  cart.push(id);
  confirmed = false;
  render();
  say(BENEFITS.get(id).name + ' added');
}
function remove(id){
  const i = cart.indexOf(id);
  if (i === -1) return;
  cart.splice(i, 1);
  confirmed = false;
  render();
  say(BENEFITS.get(id).name + ' removed');
}
function toggle(id){ cart.includes(id) ? remove(id) : add(id); }
function say(msg){ el.live.textContent = msg; }

function render(){
  el.count.textContent = cart.length;
  el.total.textContent = money(cart.reduce((sum, id) => sum + BENEFITS.get(id).price, 0));

  const slots = [];
  for (let i = 0; i < TOTAL; i++) {
    const id = cart[i];
    if (id) {
      const b = BENEFITS.get(id);
      slots.push('<button type="button" class="slot slot--filled" data-id="' + id + '" title="Remove ' + b.name + '" ' +
                 'aria-label="Remove ' + b.name + '">' + icon(b.icon) + '</button>');
    } else {
      slots.push('<div class="slot" aria-hidden="true"></div>');
    }
  }
  el.basket.innerHTML = slots.join('');
  el.hint.hidden = cart.length > 0;

  el.chosen.hidden = cart.length === 0;
  el.chosen.innerHTML = cart.map(id => {
    const b = BENEFITS.get(id);
    return '<li>' + icon(b.icon) + '<span class="name">' + b.name + '</span>' +
           '<span class="price">' + money(b.price) + '</span>' +
           '<button type="button" class="rm" data-id="' + id + '" aria-label="Remove ' + b.name + '">' +
           CLOSE + '</button></li>';
  }).join('');

  document.querySelectorAll('.row--drag').forEach(row => {
    row.classList.toggle('is-added', cart.includes(row.dataset.id));
  });

  el.confirm.disabled = cart.length === 0;
  el.confirm.hidden = confirmed;
  el.note.hidden = !confirmed;
  if (confirmed) {
    el.note.innerHTML = 'Selection confirmed: ' + cart.length +
      (cart.length === 1 ? ' benefit. ' : ' benefits. ') +
      '<button type="button" class="linkbtn" id="undo">Change selection</button>';
    document.getElementById('undo').addEventListener('click', () => { confirmed = false; render(); });
  }
}

el.basket.addEventListener('click', e => {
  const slot = e.target.closest('.slot--filled');
  if (slot) remove(slot.dataset.id);
});
el.chosen.addEventListener('click', e => {
  const btn = e.target.closest('.rm');
  if (btn) remove(btn.dataset.id);
});
el.confirm.addEventListener('click', () => {
  if (!cart.length) return;
  confirmed = true;
  render();
  say('Selection confirmed');
});

render();
</script>
</body>
</html>
